; Tiny probe firmware for the ESP32-2432S028R "Cheap Yellow Display".
; Boots, tries the ILI9341 and ST7789 display drivers, prints which panel answered over serial, then halts.
; The flasher app flashes this first to auto-detect the board.

[env:cyd_probe]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = ../firmware/partitions.csv
board_build.f_cpu = 240000000L
lib_deps =
    lovyan03/LovyanGFX@1.2.7
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
