; Next Mile mile tracker for the ESP32-2432S028R "Cheap Yellow Display"
; Two envs because CYD clones ship with either an ILI9341 or an ST7789 panel.

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bitbank2/JPEGDEC@1.8.2
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
build_flags =
    -DFW_VERSION=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -I include
    -DWM_STRINGS_FILE=\"wm_strings_nextmile.h\"

[env:cyd_ili9341]
build_flags = ${env.build_flags} -DPANEL_ILI9341 -DFW_ENV=\"cyd_ili9341\"

[env:cyd_st7789]
build_flags = ${env.build_flags} -DPANEL_ST7789 -DFW_ENV=\"cyd_st7789\"
