; Next Mile tracker for the Elecrow CrowPanel Advance 7.0" (ESP32-S3-WROOM-1-N16R8, 800x480 RGB panel, GT911 touch).
; The board version (V1.x with the STC8 backlight chip, or V3.0) is detected at startup.

[env:crowpanel7]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bitbank2/JPEGDEC@1.8.2
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
build_flags =
    -DFW_VERSION=1
    -DFW_ENV=\"crowpanel7\"
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCROWPANEL7
    -I include
    -DWM_STRINGS_FILE=\"wm_strings_nextmile.h\"
